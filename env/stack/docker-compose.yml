# Local Inji stack used as the experimental baseline.
# Derived from mosip/inji-certify v0.14.0 docker-compose/docker-compose-injistack,
# with Inji Verify 0.18.2 enabled and two Cloudflare quick tunnels added.
# Certify and Verify run unmodified; Mimoto (and the mobile wallet) are the modified side.
# See docs/architecture.md.
name: inji-thesis

services:
  database:
    image: postgres:15
    container_name: inji-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./sql/certify_init.sql:/docker-entrypoint-initdb.d/01_certify_init.sql
      - ./sql/mimoto_init.sql:/docker-entrypoint-initdb.d/02_mimoto_init.sql
      - ./sql/verify_init.sql:/docker-entrypoint-initdb.d/03_verify_init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    networks: [mosip]

  # ---------- Issuer (unmodified counterparty) ----------
  certify:
    image: injistack/inji-certify-with-plugins:0.14.0
    container_name: certify
    restart: unless-stopped
    user: root
    ports:
      - "8090:8090"
    environment:
      - container_user=mosip
      - active_profile_env=default, csvdp-farmer
      - SPRING_CONFIG_NAME=certify
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - enable_certify_artifactory=false
      - download_hsm_client=false
      # Public HTTPS identity of the issuer; written to .env by scripts/refresh-tunnels.ps1
      - PUBLIC_CERTIFY_URL=${PUBLIC_CERTIFY_URL:-http://certify-nginx}
      - PUBLIC_CERTIFY_HOST=${PUBLIC_CERTIFY_HOST:-localhost}
    volumes:
      - ./config/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./config/certify-csvdp-farmer.properties:/home/mosip/config/certify-csvdp-farmer.properties
      - ./config/certify-mock-mdl.properties:/home/mosip/config/certify-mock-mdl.properties
      - ./config/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv
      - ./config/vp_request_config.json:/home/mosip/config/vp_request_config.json
      - ./data/CERTIFY_PKCS12:/home/mosip/CERTIFY_PKCS12
    depends_on:
      database: { condition: service_healthy }
    networks: [mosip]

  certify-nginx:
    image: nginx:stable
    container_name: certify-nginx
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./nginx/certify.conf:/etc/nginx/conf.d/default.conf
      - ./config/mimoto-issuers-config.json:/config/server/mimoto-issuers-config.json
      - ./config/mimoto-trusted-verifiers.json:/config/server/mimoto-trusted-verifiers.json
      - ./config/credential-template.html:/config/server/credential-template.html
      - ./config/vp_request_config.json:/config/server/vp_request_config.json
    depends_on: [certify]
    networks: [mosip]

  # ---------- Holder side (modified later in the thesis) ----------
  mimoto-service:
    image: injistack/mimoto:0.21.0
    container_name: mimoto-service
    restart: unless-stopped
    user: root
    ports:
      - "8099:8099"
    environment:
      - container_user=mosip
      - active_profile_env=default
      - SPRING_CONFIG_NAME=mimoto
      - SPRING_CONFIG_LOCATION=/home/mosip/
      - SPRING_CLOUD_BOOTSTRAP_LOCATION=/home/mosip/mimoto-bootstrap.properties
      - oidc_p12_password=xy4gh6swa2i
      - WALLET_BINDING_PARTNER_API_KEY=dummywalletbindingpartnerapikey
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/inji_mimoto
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - GOOGLE_OAUTH_CLIENT_ID=clientId
      - GOOGLE_OAUTH_CLIENT_SECRET=clientSecret
    volumes:
      - ./config/mimoto-default.properties:/home/mosip/mimoto-default.properties
      - ./config/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties
      - ./config/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json
      - ./config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json
      - ./certs/oidckeystore.p12:/home/mosip/certs/oidckeystore.p12
    depends_on:
      database: { condition: service_healthy }
    networks: [mosip]

  inji-web:
    image: injistack/inji-web:0.16.0
    container_name: inji-web
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - DEFAULT_LANG=en
      - MIMOTO_URL=http://localhost:8099/v1/mimoto
    volumes:
      - ./config/mimoto-default.properties:/home/mosip/mimoto-default.properties
      - ./config/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json
      - ./config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json
      - ./config/credential-template.html:/home/mosip/credential-template.html
      - ./nginx/inji-web.conf:/etc/nginx/conf.d/default.conf
    depends_on: [mimoto-service]
    networks: [mosip]

  # ---------- Verifier (unmodified counterparty) ----------
  verify-service:
    image: injistack/inji-verify-service:0.18.2
    container_name: verify-service
    restart: unless-stopped
    user: root
    ports:
      - "8095:8080"
    environment:
      - active_profile_env=default
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_NAME=inji_verify
      - DATABASE_SCHEMA=verify
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - INJI_VP_REQUEST_LONG_POLLING_TIMEOUT=55000
      - INJI_VP_SUBMISSION_BASE_URL=http://verify-service:8080/v1/verify
      - INJI_DID_VERIFY_URI=did:web:verify-service:v1:verify
      - INJI_DID_VERIFY_PUBLIC_KEY_URI=did:web:verify-service:v1:verify#key-0
      - INJI_KEYSTORE_FILE_PASS=mosip
      - INJI_VERIFY_REDIRECT_URI=http://verify-service:8080
      - INJI_VERIFY_RESPONSE_CODE_EXPIRY_TIME_IN_MINS=5
      - INJI_VERIFY_CLAIMS_WITH_META_DATA=_sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
    depends_on:
      database: { condition: service_healthy }
    networks: [mosip]

  verify-ui:
    image: injistack/inji-verify-ui:0.18.2
    container_name: verify-ui
    restart: unless-stopped
    ports:
      - "3000:8000"
    environment:
      - DEFAULT_TITLE=Inji Verify
      - DEFAULT_LANG=en
      - INTERNET_CONNECTIVITY_CHECK_ENDPOINT=https://dns.google/
      - INTERNET_CONNECTIVITY_CHECK_TIMEOUT=10000
      - OVP_QR_HEADER=INJI_OVP://payload=
      - VERIFIABLE_CLAIMS_CONFIG_URL=/assets/config.json
      - VP_SUBMISSION_SUPPORTED=false
      - CLIENT_ID=inji-verify-ui
      - CLIENT_ID_DID=did:web:verify-service:v1:verify
      - DISPLAY_TIMEOUT=120000
    volumes:
      - ./verify-config/config.json:/usr/share/nginx/html/assets/config.json
    depends_on: [verify-service]
    networks: [mosip]

  # ---------- Public HTTPS tunnels ----------
  # The Android wallet requires HTTPS and did:web must resolve on a public domain,
  # so Certify (via nginx) and Mimoto are exposed through Cloudflare quick tunnels.
  # Quick-tunnel hostnames change whenever these containers are recreated.
  tunnel-certify:
    image: cloudflare/cloudflared:2026.9.3
    container_name: tunnel-certify
    command: tunnel --no-autoupdate --url http://certify-nginx:80
    restart: unless-stopped
    networks: [mosip]

  tunnel-mimoto:
    image: cloudflare/cloudflared:2026.9.3
    container_name: tunnel-mimoto
    command: tunnel --no-autoupdate --url http://mimoto-service:8099
    restart: unless-stopped
    networks: [mosip]

networks:
  mosip:
    name: mosip_network

volumes:
  pgdata:
