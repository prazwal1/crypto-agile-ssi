server {
    listen 80;

    # Local change (2026-10-14): Certify's pre-authorized access token carries every credential
    # claim as its `sub` (AccessTokenJwtUtil.generateSignedJwt), so the Authorization header grows
    # with the claims. A 24 KB face photo gave a 45 KB token and nginx's default 8 KB header buffer
    # rejected the credential request with 400 "Request Header Or Cookie Too Large".
    large_client_header_buffers 4 64k;
    # Default location for normal static files

    location / {
        root /config/server;
        autoindex on;
    }

    # Local change (2026-10-13): the offer-creation endpoint is unauthenticated in Certify, so
    # anyone reaching it could mint credentials under the issuer DID. Keep it, and the
    # actuator, off the public hostname. issue-offer and health checks use localhost:8090.
    location ^~ /v1/certify/pre-authorized-data { return 403; }
    location ^~ /v1/certify/actuator { return 403; }

    # Proxy API requests to mimoto-service
    location /v1/certify/ {
        proxy_pass http://certify:8090/v1/certify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        # Handle OPTIONS requests (for pre-flight checks)
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /.well-known/did.json {
            proxy_pass http://certify:8090/v1/certify/.well-known/did.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

            # Handle OPTIONS requests (for pre-flight checks)
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        location /.well-known/openid-credential-issuer {
                    proxy_pass http://certify:8090/v1/certify/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

    # Local change: OAuth AS metadata and JWKS for the pre-authorized code flow (RFC 8414 root well-known)
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://certify:8090/v1/certify/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
    location = /.well-known/jwks.json {
        proxy_pass http://certify:8090/v1/certify/.well-known/jwks.json;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}